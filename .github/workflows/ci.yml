# Runs on every push to main and every pull request: typecheck, unit tests,
# Playwright end-to-end tests, production build. On main, when the Cloudflare
# secrets are set, the tested build is deployed to Cloudflare Pages.
# See docs/DEPLOYMENT.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a branch or PR cancels the older run. On main, runs queue
# instead, so a deploy in progress is never cut off halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and contract tests
        run: npm test

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Production build
        run: npm run build

      - name: Security headers are in the build
        run: test -f apps/web/dist/_headers && grep -q "Content-Security-Policy" apps/web/dist/_headers

      - name: Keep Playwright's report and failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Keep the built site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: apps/web/dist
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Production dependencies have no high or critical advisories
        run: npm audit --omit=dev --audit-level=high

  deploy:
    name: Deploy to Cloudflare Pages
    needs: [test, audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    env:
      # Secrets can't be read in a job-level `if`, so each step checks this instead.
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: No Cloudflare secrets, so Pages deploys from its own Git integration
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set; skipping. See docs/DEPLOYMENT.md."

      - name: Download the build that was just tested
        if: env.HAS_CLOUDFLARE == 'true'
        uses: actions/download-artifact@v4
        with:
          name: site
          path: apps/web/dist

      - name: Deploy
        if: env.HAS_CLOUDFLARE == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=caffeine-tracker --branch=main --commit-dirty=true
